<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="60%" stop-color="#000000"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#1f1f1f" stroke-width="2" rx="18"/>

  <text x="600" y="150" text-anchor="middle" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="18">FINGER TRACK</text>
  <text x="600" y="196" text-anchor="middle" fill="#616161" font-size="20" letter-spacing="6">GESTURES · NUMBERS · DRAW WITH BOTH FINGERS</text>

  <g stroke="#e6e6e6" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M430 470 L430 380 M430 380 L300 320 M430 380 L560 320 M430 380 L430 250 M300 320 L250 280 M300 320 L260 220"/>
  </g>
  <g fill="#ffffff">
    <circle cx="430" cy="380" r="9"/>
    <circle cx="430" cy="250" r="9"/>
    <circle cx="260" cy="220" r="9"/>
    <circle cx="250" cy="280" r="9"/>
  </g>
  <g fill="#ff2436">
    <circle cx="560" cy="320" r="10"/>
  </g>
  <circle cx="530" cy="180" r="34" fill="none" stroke="#ff2436" stroke-width="4" filter="url(#soft)"/>
  <circle cx="530" cy="180" r="9" fill="#ff2436"/>

  <g transform="translate(650,250)">
    <text x="0" y="30" fill="#616161" font-size="16" letter-spacing="4">GESTURE</text>
    <text x="0" y="86" fill="#ff2436" font-size="56" font-weight="800">PEACE 2</text>
    <text x="0" y="130" fill="#e6e6e6" font-size="16" letter-spacing="3">0-5 · BONUS 6 THUMBS UP · 7 ROCK · OK</text>
    <text x="0" y="170" fill="#616161" font-size="16" letter-spacing="3">REAL-TIME · IN-BROWSER · MEDIAPIPE HANDS</text>
  </g>

  <text x="600" y="580" text-anchor="middle" fill="#3a3a3a" font-size="16" letter-spacing="4">NO INSTALL · NO UPLOAD · RUNS ON YOUR CAMERA</text>
